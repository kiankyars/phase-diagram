[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase_diagram"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "phase-diagram"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "iapws>=1.5.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]
