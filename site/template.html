<style>
/* Layout: a page from an engineering steam-table handbook. One large chart plate with
   tabulated readings beside it, then the atlas, then the supporting charts. */
:root {
  --paper: #eef2f4;
  --plate: #fbfcfc;
  --ink: #0f2029;
  --ink-2: #41535c;
  --ink-3: #66787f;
  --rule: #cfd9dd;
  --faint: #e2e9ec;
  --accent: #0b5f9e;
  --anthropic: #2a78d6;
  --openai: #eb6834;
  --good: #1b7a3d;
  --age-old: #b7d3f5;
  --age-new: #0d366b;
  --truth-line: #0f2029;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d181e; --plate: #13222a; --ink: #e7eff2; --ink-2: #b1c1c8; --ink-3: #82959d;
    --rule: #2a404b; --faint: #20343e; --accent: #6db6f2; --anthropic: #5a9fec; --openai: #f08a5f; --good: #5cc98a; --age-old: #2f5f99; --age-new: #d7e8fb; --truth-line: #ffd27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d181e; --plate: #13222a; --ink: #e7eff2; --ink-2: #b1c1c8; --ink-3: #82959d;
  --rule: #2a404b; --faint: #20343e; --accent: #6db6f2; --anthropic: #5a9fec; --openai: #f08a5f; --good: #5cc98a; --age-old: #2f5f99; --age-new: #d7e8fb; --truth-line: #ffd27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.55;
  margin: 0;
}
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 40px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 64px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); letter-spacing: -0.005em; }
h2 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h3 { font-size: 1.35rem; }
p { margin: 0; max-width: 66ch; }
a { color: var(--accent); }
.section { display: grid; gap: 22px; min-width: 0; }
.section > header { display: grid; gap: 10px; }
.lede { font-size: 1.22rem; line-height: 1.45; max-width: 58ch; }
.intro { display: grid; gap: 16px; }
.answer { font-size: 1.05rem; max-width: 66ch; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.stat { padding: 12px 18px 12px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-size: 2.5rem; font-weight: 600; line-height: 1; }
.stat span { font-size: 0.92rem; color: var(--ink-2); line-height: 1.3; }

.explorer { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 30px; align-items: start; }
.plate { background: var(--plate); border: 1px solid var(--rule); padding: 18px 20px 14px 14px; min-width: 0; }
.chart-frame { display: grid; grid-template-columns: 52px minmax(0, 1fr); grid-template-rows: auto 28px; }
.y-axis, .x-axis { position: relative; font-family: var(--data); font-size: 0.7rem; color: var(--ink-2); }
.y-axis span { position: absolute; right: 8px; transform: translateY(-50%); white-space: nowrap; }
.x-axis { grid-column: 2; }
.x-axis span { position: absolute; top: 7px; transform: translateX(-50%); white-space: nowrap; }
.map {
  position: relative;
  aspect-ratio: 1;
  width: 100%;
  background: var(--rule);
  display: block;
}
.map canvas, .map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map canvas { image-rendering: pixelated; }
.map svg { pointer-events: none; overflow: visible; }
#bigMap { cursor: crosshair; outline-offset: 3px; }
#bigMap:focus-visible { outline: 2px solid var(--accent); }
.cursor { fill: none; stroke: #fff; stroke-width: 2; vector-effect: non-scaling-stroke; paint-order: stroke; }
.cursor-shadow { fill: none; stroke: #0b0b0b; stroke-width: 4; vector-effect: non-scaling-stroke; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--data); font-size: 0.76rem; color: var(--ink-2); padding: 10px 0 0 52px; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
.legend.flush { padding: 0; }
.grid-note { font-size: 0.92rem; color: var(--ink-2); }

.panel { display: grid; gap: 18px; min-width: 0; }
.control { display: grid; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.control > label, .control > legend { font-family: var(--data); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); padding: 0; }
select {
  font-family: var(--display);
  font-size: 1.5rem;
  font-weight: 600;
  background: var(--plate);
  color: var(--ink);
  border: 1px solid var(--rule);
  padding: 6px 10px;
  width: 100%;
  min-width: 0;
}
.segments { display: flex; flex-wrap: wrap; gap: 0; }
.segments input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.segments label {
  font-family: var(--data);
  font-size: 0.8rem;
  padding: 7px 11px;
  border: 1px solid var(--rule);
  margin: 0 -1px -1px 0;
  background: var(--plate);
  color: var(--ink-2);
  cursor: pointer;
}
.segments input:checked + label { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.segments input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.segments input:disabled + label { opacity: 0.45; cursor: not-allowed; }

.readout { border-top: 2px solid var(--ink); padding-top: 10px; display: grid; gap: 10px; }
.prompt { font-size: 1rem; line-height: 1.4; min-height: 4.2em; }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: var(--data); font-size: 0.8rem; }
.verdict div { display: grid; gap: 1px; }
.verdict small { color: var(--ink-3); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; }
.verdict b { font-family: var(--display); font-size: 1.5rem; font-weight: 600; }
.readings { width: 100%; border-collapse: collapse; font-family: var(--data); font-size: 0.8rem; }
.readings td, .readings th { padding: 5px 0; border-bottom: 1px solid var(--rule); text-align: left; font-weight: 400; vertical-align: top; }
.readings td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.readings th { color: var(--ink-2); }

.atlas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
.tile { all: unset; display: grid; gap: 5px; cursor: pointer; min-width: 0; }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.tile-head { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.tile-name { font-family: var(--display); font-size: 1.08rem; font-weight: 600; line-height: 1.1; }
.tile-score { font-family: var(--data); font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile:hover .tile-name { color: var(--accent); }
.tile.reference { cursor: default; }
.tile.reference:hover .tile-name { color: inherit; }
.provider-title { grid-column: 1 / -1; font-family: var(--display); font-size: 1.3rem; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--rule); padding-bottom: 3px; }

.chart { background: var(--plate); border: 1px solid var(--rule); padding: 14px 16px; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 620px; }
.chart text { font-family: var(--data); font-size: 11px; fill: var(--ink-2); }
.chart .name { font-family: var(--display); font-size: 15px; font-weight: 600; fill: var(--ink); }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1; }
.chart .bar { stroke: var(--rule); stroke-width: 3; stroke-linecap: round; }
.chart .hit { fill: transparent; }
.chart .fan-line { fill: none; stroke-width: 1.4; stroke-linejoin: round; }
.chart .fan-hit { fill: none; stroke: transparent; stroke-width: 10; }
.chart g.lit .fan-line { stroke: var(--openai); stroke-width: 2.6; }
.chart .truth-line { fill: none; stroke: var(--truth-line); stroke-width: 2.2; stroke-linejoin: round; pointer-events: none; }
.chart-key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--data); font-size: 0.76rem; color: var(--ink-2); padding-top: 8px; }
.ramp-key { display: inline-block; width: 90px; height: 11px; vertical-align: -1px; margin: 0 6px; background: linear-gradient(90deg, var(--age-old), var(--age-new)); }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.dot.hollow { background: transparent; box-shadow: inset 0 0 0 2px var(--ink-3); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.unit-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 30px; align-items: end; }
.unit-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.unit-row figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
.unit-row figcaption { font-family: var(--data); font-size: 0.72rem; color: var(--ink-2); display: flex; justify-content: space-between; flex-wrap: wrap; }
.regions th { min-width: 84px; }
.regions td.cell { text-align: center; }
.missed { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.missed figure { margin: 0; display: grid; gap: 6px; }
.missed figcaption { font-family: var(--display); font-size: 1.2rem; font-weight: 600; }
.thoughts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.thoughts figure { margin: 0; display: grid; gap: 5px; }
.thoughts figcaption { font-family: var(--display); font-size: 1.05rem; font-weight: 600; }
.thoughts figcaption small { display: block; font-family: var(--data); font-size: 0.7rem; font-weight: 400; color: var(--ink-2); }
.table-wrap { overflow-x: auto; background: var(--plate); border: 1px solid var(--rule); }
table.scores { border-collapse: collapse; width: 100%; font-family: var(--data); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
table.scores th, table.scores td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
table.scores th { color: var(--ink-3); font-weight: 400; vertical-align: bottom; white-space: normal; min-width: 72px; }
table.scores th:first-child, table.scores td:first-child { text-align: left; font-family: var(--display); font-size: 1rem; font-weight: 600; color: var(--ink); }
details { min-width: 0; }
details summary { font-family: var(--data); font-size: 0.82rem; cursor: pointer; color: var(--accent); padding: 4px 0; }
details[open] summary { margin-bottom: 10px; }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px 34px; }
.notes div { display: grid; gap: 5px; align-content: start; }
.notes p { font-size: 0.97rem; }
.finding { display: grid; gap: 6px; }
.tip {
  position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--paper);
  font-family: var(--data); font-size: 0.74rem; padding: 6px 9px; line-height: 1.35; max-width: 260px;
}
ol.sources { margin: 0; padding-left: 20px; font-size: 0.95rem; display: grid; gap: 4px; }
.colophon { border-top: 2px solid var(--ink); padding-top: 12px; font-size: 0.95rem; color: var(--ink-2); }
@media (max-width: 860px) {
  .explorer { grid-template-columns: minmax(0, 1fr); }
  .unit-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .page { gap: 48px; padding-block: 28px 56px; }
}
@media (max-width: 460px) {
  .chart-frame { grid-template-columns: 44px minmax(0, 1fr); }
  .legend:not(.flush) { padding-left: 44px; }
}
</style>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="trueCurves"></g></defs></svg>

<div class="page">
<!--PAGE-->

  <footer class="colophon">
    <p>Answers collected on 31 October 2026.</p>
  </footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(function () {
  "use strict";
  const D = /*DATA*/null;
  const PHASES = ["Solid", "Liquid", "Vapor", "Supercritical"];
  const COLORS = [[42, 120, 214], [0, 131, 0], [237, 161, 0], [232, 123, 164]];
  const HEX = ["#2a78d6", "#008300", "#eda100", "#e87ba4"];
  const CONDITIONS = { instant: "Answering instantly", reasoned: "Reasoning allowed" };
  const PROVIDER = { anthropic: "Anthropic", openai: "OpenAI" };
  const RAMP = [[238, 242, 244], [205, 226, 251], [158, 197, 244], [109, 167, 236], [57, 135, 229], [42, 120, 214], [37, 106, 191], [28, 92, 171], [16, 66, 129], [13, 54, 107]];
  const FAMILY = { opus: "Opus", sonnet: "Sonnet", haiku: "Haiku", fable: "Fable", gpt: "GPT", small: "Small GPT", "o-series": "o3" };
  const $ = (id) => document.getElementById(id);
  const svgNS = "http://www.w3.org/2000/svg";
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const fixed = (x, n = 2) => (x === null || x === undefined ? "–" : x.toFixed(n));

  const START_CELL = { x: 0.39, y: 0.57 };
  const state = { model: null, condition: "instant", framing: D.framings[0].key, view: "answers", cell: null, unitsModel: null, unitsCondition: "instant" };
  const byId = Object.fromEntries(D.models.map((m) => [m.id, m]));
  const inOrder = (provider) => D.models.filter((m) => m.provider === provider).sort((a, b) => a.released.localeCompare(b.released));
  const key = (id, condition, framing) => `${id}|${condition}|${framing}`;
  const named = (m) => m.label + (m.thinks ? " *" : "");
  const gridName = (level) => `${D.side >> level} × ${D.side >> level}`;

  /* Each grid level keeps one query point per block. */
  const lookups = {};
  function lookup(level) {
    if (lookups[level]) return lookups[level];
    const side = D.side >> level;
    const table = new Int32Array(side * side).fill(-1);
    for (let pid = 0; pid < D.side * D.side; pid++) {
      if (+D.levelOf[pid] >= level) {
        const i = Math.floor(pid / D.side) >> level;
        const j = (pid % D.side) >> level;
        table[i * side + j] = pid;
      }
    }
    return (lookups[level] = table);
  }

  function drawCells(canvas, cells, side, paint) {
    canvas.width = side;
    canvas.height = side;
    const ctx = canvas.getContext("2d");
    const image = ctx.createImageData(side, side);
    for (let i = 0; i < side; i++) {
      for (let j = 0; j < side; j++) {
        const rgba = paint(cells[i * side + j], i, j);
        const at = ((side - 1 - j) * side + i) * 4;
        image.data[at] = rgba[0];
        image.data[at + 1] = rgba[1];
        image.data[at + 2] = rgba[2];
        image.data[at + 3] = rgba.length > 3 ? rgba[3] : 255;
      }
    }
    ctx.putImageData(image, 0, 0);
  }

  const hexToRgb = (hex) => [1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16));
  const answerPaint = (c) => (c >= "0" && c <= "3" ? COLORS[+c] : [195, 194, 183]);

  function errorPaint(level) {
    const table = lookup(level);
    const side = D.side >> level;
    const faint = hexToRgb(css("--faint"));
    return (c, i, j) => {
      const pid = table[i * side + j];
      const truth = D.truth[pid];
      return c === truth ? faint : answerPaint(c);
    };
  }

  function buildCurves() {
    const group = $("trueCurves");
    const { tMin, tMax, logpMin, logpMax } = D.bounds;
    for (const line of D.curves) {
      const path = document.createElementNS(svgNS, "polyline");
      for (const [name, value] of Object.entries({ fill: "none", stroke: "#0b0b0b", "stroke-width": 1, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" })) {
        path.setAttribute(name, value);
      }
      path.setAttribute("points", line.map(([t, p]) => `${(1000 * (t - tMin)) / (tMax - tMin)},${1000 * (1 - (p - logpMin) / (logpMax - logpMin))}`).join(" "));
      group.appendChild(path);
    }
  }

  function buildAxes() {
    const { tMin, tMax, logpMin, logpMax } = D.bounds;
    for (const t of [200, 300, 400, 500, 600, 700, 800]) {
      const tick = document.createElement("span");
      tick.textContent = t === 800 ? "800 K" : t;
      tick.style.left = `${(100 * (t - tMin)) / (tMax - tMin)}%`;
      $("xAxis").appendChild(tick);
    }
    const names = { 0: "1 Pa", 3: "1 kPa", 6: "1 MPa", 9: "1 GPa" };
    for (const p of [0, 3, 6, 9]) {
      const tick = document.createElement("span");
      tick.textContent = names[p];
      tick.style.top = `${100 * (1 - (p - logpMin) / (logpMax - logpMin))}%`;
      $("yAxis").appendChild(tick);
    }
  }

  function legend(host) {
    PHASES.forEach((name, k) => {
      const item = document.createElement("span");
      item.innerHTML = `<i style="background:${HEX[k]}"></i>${name}`;
      host.appendChild(item);
    });
    const none = document.createElement("span");
    none.innerHTML = `<i style="background:#c3c2b7"></i>No answer`;
    host.appendChild(none);
    const line = document.createElement("span");
    line.textContent = "— IAPWS boundary or critical line";
    host.appendChild(line);
  }

  function segments(host, name, options, current, onChange) {
    host.innerHTML = "";
    for (const [value, text, disabled] of options) {
      const id = `${name}-${value}`;
      const input = document.createElement("input");
      Object.assign(input, { type: "radio", name, id, value, checked: value === current, disabled: !!disabled });
      input.addEventListener("change", () => onChange(value));
      const label = document.createElement("label");
      label.htmlFor = id;
      label.textContent = text;
      host.append(input, label);
    }
  }

  function currentMap() {
    return D.maps[key(state.model, state.condition, state.framing)] || null;
  }

  function hasCondition(id, condition) {
    return !!D.maps[key(id, condition, D.framings[0].key)];
  }

  function renderBig() {
    const entry = currentMap();
    if (!entry) return;
    const side = D.side >> entry.level;
    drawCells($("bigCanvas"), entry.cells, side, state.view === "errors" ? errorPaint(entry.level) : answerPaint);
    renderReadout();
  }

  /* The prompt, written exactly as the experiment wrote it. */
  function formatNumber(x, sig = 4) {
    const [mantissa, rawExponent] = x.toExponential(sig - 1).split("e");
    const exponent = +rawExponent;
    if (exponent >= -3 && exponent < 6) return Number(`${mantissa}e${exponent}`).toFixed(Math.max(sig - 1 - exponent, 0));
    return `${mantissa}e${exponent}`;
  }
  const formatT = (T, unit) => (unit === "K" ? `${T.toFixed(2)} kelvin` : `${(T - 273.15).toFixed(2)} degrees Celsius`);
  const formatP = (p, unit) => {
    if (unit === "Pa") return `${formatNumber(p)} pascals`;
    if (unit === "MPa") return `${formatNumber(p / 1e6)} megapascals`;
    return `${formatNumber(p / 101325)} atmospheres`;
  };

  function renderReadout() {
    const entry = currentMap();
    if (!entry) return;
    const side = D.side >> entry.level;
    const cell = state.cell || START_CELL;
    const i = Math.min(Math.floor(cell.x * side), side - 1);
    const j = Math.min(Math.floor(cell.y * side), side - 1);
    const pid = lookup(entry.level)[i * side + j];
    const T = D.T[pid];
    const p = D.p[pid];
    const framing = D.framings.find((f) => f.key === state.framing);
    $("prompt").textContent = `Pure water at equilibrium, at ${formatT(T, framing.t)} and ${formatP(p, framing.p)}: solid, liquid, vapor, or supercritical? Do not say anything else.`;
    const answer = entry.cells[i * side + j];
    const truth = D.truth[pid];
    $("said").textContent = answer >= "0" && answer <= "3" ? PHASES[+answer] : "No answer";
    $("said").style.color = answer === truth ? "var(--good)" : "";
    $("actual").textContent = PHASES[+truth];
    const scores = entry.scores;
    const unitScores = byId[state.model].units[state.condition] || {};
    const unitGrid = gridName(D.unitLevels[state.condition]);
    const reading = (value, digits, unit) => (value === undefined || value === null ? "–" : `${fixed(value, digits)} ${unit}`);
    const rows = [
      ["Grid", `${side} × ${side}`],
      ["Balanced accuracy", fixed(scores.balanced_accuracy)],
      ["Boiling curve error", reading(scores.saturation_mae, 2, "decades of pressure")],
      ["Melting curve error", reading(scores.melting_mae, 0, "K")],
      ["Boils at 1 atm", reading(scores.boils_at, 0, "K")],
      ["Freezes at 1 atm", reading(scores.freezes_at, 0, "K")],
      [`Agreement across units, ${unitGrid}`, unitScores.cross === undefined ? "–" : `${fixed(100 * unitScores.cross, 0)}%`],
      [`Agreement with itself, K, MPa and °C, atm, ${unitGrid}`, unitScores.retest === undefined || unitScores.retest === null ? "–" : `${fixed(100 * unitScores.retest, 0)}%`],
    ];
    if (state.condition === "reasoned") rows.push(["Replies that reasoned, these units", `${fixed(100 * scores.share_thought, 0)}%`]);
    $("readings").innerHTML = rows.map(([a, b]) => `<tr><th scope="row">${a}</th><td>${b}</td></tr>`).join("");
    const size = 1000 / side;
    for (const id of ["cursor", "cursorShadow"]) {
      const rect = $(id);
      rect.hidden = false;
      rect.setAttribute("x", i * size);
      rect.setAttribute("y", (side - 1 - j) * size);
      rect.setAttribute("width", size);
      rect.setAttribute("height", size);
    }
  }

  function setModel(id) {
    state.model = id;
    $("modelSelect").value = id;
    if (!hasCondition(id, state.condition)) state.condition = hasCondition(id, "instant") ? "instant" : "reasoned";
    renderConditionControl();
    renderFramingControl();
    renderBig();
  }

  /* Not every model has a map in every notation, so those that do not stay unavailable. */
  function renderFramingControl() {
    const available = (framing) => !!D.maps[key(state.model, state.condition, framing)];
    if (!available(state.framing)) state.framing = D.framings[0].key;
    segments($("framingControl"), "framing", D.framings.map((f) => [f.key, f.label, !available(f.key)]), state.framing, (value) => {
      state.framing = value;
      renderBig();
    });
  }

  function renderConditionControl() {
    const options = Object.entries(CONDITIONS).map(([value, text]) => [value, text, !hasCondition(state.model, value)]);
    segments($("conditionControl"), "condition", options, state.condition, (value) => {
      state.condition = value;
      renderFramingControl();
      renderBig();
    });
  }

  function atlasTile(model, condition) {
    const entry = D.maps[key(model.id, condition, D.framings[0].key)];
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "tile";
    const score = model.scores[condition] ? fixed(model.scores[condition].balanced_accuracy) : "";
    tile.setAttribute("aria-label", `${model.label}, balanced accuracy ${score}. Open in the explorer.`);
    tile.innerHTML = `<span class="tile-head"><span class="tile-name">${named(model)}</span><span class="tile-score">${score}</span></span>
      <span class="map"><canvas></canvas><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><use href="#trueCurves"></use></svg></span>`;
    drawCells(tile.querySelector("canvas"), entry.cells, D.side >> entry.level, answerPaint);
    tile.addEventListener("click", () => {
      state.condition = condition;
      setModel(model.id);
      $("explore-title").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    });
    return tile;
  }

  function referenceTile(name, cells, score) {
    const tile = document.createElement("div");
    tile.className = "tile reference";
    tile.innerHTML = `<span class="tile-head"><span class="tile-name">${name}</span><span class="tile-score">${score}</span></span>
      <span class="map"><canvas></canvas><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><use href="#trueCurves"></use></svg></span>`;
    drawCells(tile.querySelector("canvas"), cells, D.side, answerPaint);
    return tile;
  }

  function renderAtlas(condition) {
    const host = $("atlas");
    host.innerHTML = "";
    const title = document.createElement("div");
    title.className = "provider-title";
    title.textContent = "For reference";
    host.append(title, referenceTile("IAPWS", D.truth, "1.00"), referenceTile("Four-fact sketch", D.sketch, fixed(D.references["Four-fact sketch"][D.level])));
    for (const provider of ["anthropic", "openai"]) {
      const models = inOrder(provider).filter((m) => hasCondition(m.id, condition));
      if (!models.length) continue;
      const title = document.createElement("div");
      title.className = "provider-title";
      title.textContent = PROVIDER[provider];
      host.appendChild(title);
      for (const model of models) host.appendChild(atlasTile(model, condition));
    }
  }

  /* Charts are small hand-built SVGs on one linear scale each. */
  function el(tag, attrs, parent, text) {
    const node = document.createElementNS(svgNS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text !== undefined) node.textContent = text;
    if (parent) parent.appendChild(node);
    return node;
  }

  function tooltip(node, html) {
    const tip = $("tip");
    const show = (event) => {
      tip.innerHTML = html;
      tip.hidden = false;
      const box = tip.getBoundingClientRect();
      const x = Math.min(event.clientX + 14, innerWidth - box.width - 8);
      const y = Math.max(event.clientY - box.height - 10, 8);
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    };
    node.addEventListener("pointerenter", show);
    node.addEventListener("pointermove", show);
    node.addEventListener("pointerleave", () => (tip.hidden = true));
  }

  function dumbbells(host, rows, options) {
    host.innerHTML = "";
    const rowHeight = 25;
    const left = 130;
    const right = 22;
    const width = 860;
    const groups = [...new Set(rows.map((r) => r.provider))];
    const height = 30 + rows.length * rowHeight + groups.length * 24;
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": options.label }, host);
    const [lo, hi] = options.domain;
    const x = (v) => left + ((v - lo) / (hi - lo)) * (width - left - right);
    for (const tick of options.ticks) {
      el("line", { class: "grid", x1: x(tick), x2: x(tick), y1: 18, y2: height - 4 }, svg);
      el("text", { x: x(tick), y: 11, "text-anchor": "middle" }, svg, options.tickFormat ? options.tickFormat(tick) : tick.toFixed(2));
    }
    if (options.reference) {
      el("line", { class: "ref", x1: x(options.reference.value), x2: x(options.reference.value), y1: 18, y2: height - 4 }, svg);
    }
    let y = 22;
    for (const provider of groups) {
      y += 18;
      el("text", { class: "name", x: 0, y: y - 2 }, svg, PROVIDER[provider]);
      y += 6;
      for (const row of rows.filter((r) => r.provider === provider)) {
        y += rowHeight;
        const cy = y - 8;
        el("text", { class: "name", x: 0, y: cy + 5 }, svg, row.name);
        if (row.a !== null && row.b !== null) el("line", { class: "bar", x1: x(row.a), x2: x(row.b), y1: cy, y2: cy }, svg);
        const color = provider === "anthropic" ? css("--anthropic") : css("--openai");
        if (row.a !== null) el("circle", { cx: x(row.a), cy, r: 5, fill: css("--plate"), stroke: css("--ink-3"), "stroke-width": 2 }, svg);
        if (row.b !== null) el("circle", { cx: x(row.b), cy, r: 6, fill: color, stroke: css("--plate"), "stroke-width": 2 }, svg);
        const hit = el("rect", { class: "hit", x: 0, y: y - rowHeight + 2, width, height: rowHeight }, svg);
        tooltip(hit, options.tip(row));
      }
    }
  }

  function dateScale(start, end, left, right) {
    const a = +new Date(start);
    const b = +new Date(end);
    return (d) => left + ((+new Date(d) - a) / (b - a)) * (right - left);
  }

  function timeChart(host, condition) {
    const box = document.createElement("div");
    box.className = "chart";
    const title = document.createElement("h3");
    title.textContent = CONDITIONS[condition];
    title.style.marginBottom = "8px";
    box.appendChild(title);
    const width = 520;
    const height = 300;
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": `Balanced accuracy by release date, ${CONDITIONS[condition]}`, style: "min-width:0" }, box);
    const x = dateScale("2024-06-15", "2026-11-15", 40, width - 72);
    const y = (v) => height - 26 - ((v - 0.5) / 0.5) * (height - 40);
    for (const tick of [0.5, 0.6, 0.7, 0.8, 0.9, 1]) {
      el("line", { class: "grid", x1: 40, x2: width - 72, y1: y(tick), y2: y(tick) }, svg);
      el("text", { x: 34, y: y(tick) + 4, "text-anchor": "end" }, svg, tick.toFixed(1));
    }
    for (const year of [2025, 2026]) {
      el("text", { x: x(`${year}-01-01`), y: height - 8, "text-anchor": "middle" }, svg, year);
    }
    const sketch = D.references["Four-fact sketch"][D.level];
    el("line", { class: "ref", x1: 40, x2: width - 72, y1: y(sketch), y2: y(sketch) }, svg);
    el("text", { x: 44, y: y(sketch) + 14 }, svg, `Four-fact sketch ${sketch.toFixed(2)}`);
    const ends = [];
    for (const provider of ["anthropic", "openai"]) {
      const color = provider === "anthropic" ? css("--anthropic") : css("--openai");
      const models = inOrder(provider).filter((m) => m.scores[condition]);
      for (const family of new Set(models.map((m) => m.family))) {
        const line = models.filter((m) => m.family === family);
        const last = line[line.length - 1];
        const dotY = y(last.scores[condition].balanced_accuracy);
        if (line.length === 1 && last.released < "2026-01-01") el("text", { x: x(last.released), y: dotY - 9, "text-anchor": "middle" }, svg, FAMILY[family]);
        else ends.push({ name: FAMILY[family], dotX: x(last.released), dotY, y: dotY });
        if (line.length > 1) el("polyline", { fill: "none", stroke: color, "stroke-width": 2, points: line.map((m) => `${x(m.released)},${y(m.scores[condition].balanced_accuracy)}`).join(" ") }, svg);
      }
      for (const model of models) {
        const value = model.scores[condition].balanced_accuracy;
        el("circle", { cx: x(model.released), cy: y(value), r: 4.5, fill: color, stroke: css("--plate"), "stroke-width": 2 }, svg);
        const hit = el("circle", { class: "hit", cx: x(model.released), cy: y(value), r: 12 }, svg);
        tooltip(hit, `<b>${named(model)}</b><br>${model.released}<br>Balanced accuracy ${value.toFixed(3)}`);
      }
    }
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 13);
    for (const end of ends) {
      el("line", { class: "grid", x1: end.dotX + 6, y1: end.dotY, x2: width - 70, y2: end.y }, svg);
      el("text", { x: width - 68, y: end.y + 4 }, svg, end.name);
    }
    host.appendChild(box);
  }

  const lerpColor = (a, b, f) => {
    const [from, to] = [hexToRgb(a), hexToRgb(b)];
    return `rgb(${from.map((v, k) => Math.round(v + (to[k] - v) * f)).join(",")})`;
  };

  function fanChart(host, condition) {
    const box = document.createElement("div");
    box.className = "chart";
    const title = document.createElement("h3");
    title.textContent = CONDITIONS[condition];
    title.style.marginBottom = "8px";
    box.appendChild(title);
    const { tMin, tMax, logpMin, logpMax } = D.bounds;
    const [width, height, left, bottom] = [520, 470, 48, 24];
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": `Every model's boiling and melting curves, ${CONDITIONS[condition]}`, style: "min-width:0" }, box);
    const x = (t) => left + ((t - tMin) / (tMax - tMin)) * (width - left - 6);
    const y = (p) => 6 + (1 - (p - logpMin) / (logpMax - logpMin)) * (height - bottom - 6);
    const line = ([t, p]) => `${x(t)},${y(p)}`;
    for (const [p, name] of [[0, "1 Pa"], [3, "1 kPa"], [6, "1 MPa"], [9, "1 GPa"]]) {
      el("line", { class: "grid", x1: left, x2: width - 6, y1: y(p), y2: y(p) }, svg);
      el("text", { x: left - 6, y: y(p) + 4, "text-anchor": "end" }, svg, name);
    }
    for (const t of [200, 400, 600, 800]) el("text", { x: x(t), y: height - 6, "text-anchor": "middle" }, svg, t === 800 ? "800 K" : t);
    const models = D.models.filter((m) => m.curves[condition]).sort((a, b) => a.released.localeCompare(b.released));
    const dated = D.models.filter((m) => Object.keys(m.curves).length).map((m) => +new Date(m.released));
    const first = Math.min(...dated);
    const span = Math.max(...dated) - first || 1;
    const lines = el("g", {}, svg);
    for (const model of models) {
      const group = el("g", {}, lines);
      const color = lerpColor(css("--age-old"), css("--age-new"), (+new Date(model.released) - first) / span);
      for (const curve of Object.values(model.curves[condition])) {
        if (curve.length < 2) continue;
        el("polyline", { class: "fan-line", stroke: color, points: curve.map(line).join(" ") }, group);
        el("polyline", { class: "fan-hit", points: curve.map(line).join(" ") }, group);
      }
      tooltip(group, `<b>${named(model)}</b><br>${model.released}`);
      group.addEventListener("pointerenter", () => {
        group.classList.add("lit");
        lines.appendChild(group);
      });
      group.addEventListener("pointerleave", () => group.classList.remove("lit"));
    }
    for (const curve of D.curves) el("polyline", { class: "truth-line", points: curve.map(line).join(" ") }, svg);
    host.appendChild(box);
  }

  function renderMissed() {
    const host = $("missedMaps");
    for (const condition of Object.keys(CONDITIONS)) {
      const entry = D.missed[condition];
      const figure = document.createElement("figure");
      figure.innerHTML = `<figcaption>${CONDITIONS[condition]}, ${entry.models} models</figcaption>
        <div class="map"><canvas></canvas><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><use href="#trueCurves"></use></svg></div>`;
      drawCells(figure.querySelector("canvas"), entry.cells, D.side >> entry.level, (c) => RAMP[+c]);
      host.appendChild(figure);
    }
  }

  /* A map's answers at a coarser level, which are a subset of its cells. */
  function cellsAt(entry, level) {
    if (entry.level === level) return entry.cells;
    const fine = D.side >> entry.level;
    return Array.from(lookup(level), (pid) => entry.cells[(Math.floor(pid / D.side) >> entry.level) * fine + ((pid % D.side) >> entry.level)]).join("");
  }

  /* All six maps at the coarsest level any of them has, so resolution cannot read as a unit effect. */
  function renderRegions(condition) {
    const models = ["anthropic", "openai"].flatMap(inOrder).filter((m) => m.scores[condition]);
    const shade = (value) => {
      const step = Math.round(value * (RAMP.length - 1));
      return `background:rgb(${RAMP[step].join(",")});color:${step > 4 ? "#fff" : "#0f2029"}`;
    };
    const head = `<thead><tr><th scope="col">Share wrong, %</th>${D.regions.map(([, name]) => `<th scope="col">${name}</th>`).join("")}</tr></thead>`;
    const rows = models.map((m) => `<tr><td>${named(m)}</td>${D.regions.map(([field]) => `<td class="cell" style="${shade(m.scores[condition][field])}">${fixed(100 * m.scores[condition][field], 0)}</td>`).join("")}</tr>`);
    $("regionTable").innerHTML = `${head}<tbody>${rows.join("")}</tbody>`;
  }

  function renderBoiling() {
    const rows = ["anthropic", "openai"].flatMap(inOrder).filter((m) => Object.keys(m.boils).length).map((m) => {
      const values = Object.values(m.boils);
      return { provider: m.provider, label: m.label, name: named(m), a: Math.min(...values), b: Math.max(...values), boils: m.boils };
    });
    dumbbells($("boilChart"), rows, {
      domain: [200, 700],
      ticks: [200, 300, 400, 500, 600, 700],
      tickFormat: (t) => `${t} K`,
      reference: { value: 373.124 },
      label: "The boiling point at one atmosphere each model implies, lowest and highest reading across up to six sets of units",
      tip: (r) => `<b>${r.name}</b><br>${D.framings.map((f) => `${f.label}: ${fixed(r.boils[f.key], 0)} K`).join("<br>")}`,
    });
    $("boilKey").innerHTML = `<span><i class="dot hollow"></i>Lowest reading</span><span><i class="dot" style="background:var(--anthropic)"></i><i class="dot" style="background:var(--openai)"></i>Highest reading</span><span>Vertical line: the true 373 K</span>`;
  }

  function renderUnitRow() {
    const host = $("unitRow");
    host.innerHTML = "";
    const entries = D.framings.map((f) => D.maps[key(state.unitsModel, state.unitsCondition, f.key)]);
    const level = Math.max(...entries.map((entry) => entry.level));
    const atlasGap = level === D.level ? "" : `, so a score here can differ from the ${gridName(D.level)} atlas`;
    $("unitGrid").textContent = `Maps and scores at ${gridName(level)}, the finest grid this model has in all six sets of units${atlasGap}.`;
    D.framings.forEach((framing, k) => {
      const figure = document.createElement("figure");
      const ba = (byId[state.unitsModel].byFraming[state.unitsCondition][framing.key] || {})[level];
      figure.innerHTML = `<figcaption><span>${framing.label}</span><span>${ba === undefined || ba === null ? "" : ba.toFixed(2)}</span></figcaption>
        <div class="map"><canvas></canvas><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><use href="#trueCurves"></use></svg></div>`;
      drawCells(figure.querySelector("canvas"), cellsAt(entries[k], level), D.side >> level, answerPaint);
      host.appendChild(figure);
    });
  }

  /* Opens on the model that notation moves the most under this condition. */
  function renderUnitsModels() {
    const condition = state.unitsCondition;
    const select = $("unitsModel");
    const models = ["anthropic", "openai"].flatMap(inOrder).filter((m) => m.units[condition]);
    select.innerHTML = "";
    for (const model of models) select.appendChild(new Option(named(model), model.id));
    const worst = [...models].sort((a, b) => b.units[condition].gap - a.units[condition].gap)[0];
    if (!models.some((m) => m.id === state.unitsModel)) state.unitsModel = worst.id;
    select.value = state.unitsModel;
    renderUnitRow();
  }

  function renderUnitsChart(condition) {
    const rows = [];
    for (const provider of ["anthropic", "openai"]) {
      for (const model of inOrder(provider)) {
        const scores = model.units[condition];
        if (scores) rows.push({ provider, label: model.label, name: named(model), a: scores.cross, b: scores.retest ?? null });
      }
    }
    dumbbells($("unitsChart"), rows, {
      domain: [0.7, 1],
      ticks: [0.7, 0.8, 0.9, 1],
      tickFormat: (t) => `${(100 * t).toFixed(0)}%`,
      label: "Agreement across unit systems against agreement of a prompt with itself",
      tip: (r) => `<b>${r.name}</b><br>Across units ${(100 * r.a).toFixed(1)}%<br>Asked twice ${r.b === null ? "–" : `${(100 * r.b).toFixed(1)}%`}`,
    });
  }

  function renderThoughts() {
    const host = $("thoughts");
    for (const model of D.models) {
      const entry = D.thought[model.id];
      if (!entry || !model.scores.reasoned || model.scores.reasoned.share_thought > 0.95) continue;
      const figure = document.createElement("figure");
      figure.innerHTML = `<figcaption>${named(model)}<small>${fixed(100 * entry.near, 0)}% near a line, ${fixed(100 * entry.far, 0)}% far from one</small></figcaption>
        <div class="map"><canvas></canvas><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><use href="#trueCurves"></use></svg></div>`;
      drawCells(figure.querySelector("canvas"), entry.cells, D.side >> entry.level, (c) => RAMP[+c]);
      host.appendChild(figure);
    }
    $("thoughtKey").innerHTML = `<span>No reasoning<i class="ramp-key" style="background:linear-gradient(90deg,rgb(238,242,244),rgb(42,120,214),rgb(13,54,107))"></i>${D.thoughtLimit} tokens or more</span>`;
  }

  function renderTable() {
    const both = (name, get, digits, suffix = () => "") => [
      [`${name}, instant${suffix("instant")}`, (m) => get(m, "instant"), digits],
      [`${name}, reasoning allowed${suffix("reasoned")}`, (m) => get(m, "reasoned"), digits],
    ];
    const atUnitGrid = (condition) => `, ${gridName(D.unitLevels[condition])}`;
    const score = (field) => (m, condition) => m.scores[condition]?.[field];
    const unit = (field) => (m, condition) => m.units[condition]?.[field];
    const columns = [
      ...both("Balanced accuracy", score("balanced_accuracy"), 2),
      ...both("Everyday water", score("ba_familiar"), 2),
      ...both("Everywhere else", score("ba_unfamiliar"), 2),
      ...both("Boils at 1 atm, K", score("boils_at"), 0),
      ...both("Freezes at 1 atm, K", score("freezes_at"), 0),
      ...both("Boiling curve error, decades", score("saturation_mae"), 2),
      ...both("Melting curve error, K", score("melting_mae"), 0),
      ...both("Implied critical temperature, K", score("critical_T"), 0),
      ...both("Agreement across units", unit("cross"), 2, atUnitGrid),
      ...both("Agreement asked twice", unit("retest"), 2, atUnitGrid),
      ["Replies that reasoned", (m) => (m.scores.reasoned ? 100 * m.scores.reasoned.share_thought : undefined), 0],
      ["Reasoning tokens per reply", (m) => m.scores.reasoned?.reasoning_tokens, 0],
    ];
    const head = `<thead><tr><th scope="col">Model</th>${columns.map(([name]) => `<th scope="col">${name}</th>`).join("")}</tr></thead>`;
    const rows = ["anthropic", "openai"].flatMap(inOrder).map((m) => `<tr><td>${named(m)}</td>${columns.map(([, get, digits]) => `<td>${fixed(get(m), digits)}</td>`).join("")}</tr>`);
    $("scoreTable").innerHTML = `${head}<tbody>${rows.join("")}</tbody>`;
  }

  function renderStats() {
    const best = (condition) => D.models.filter((m) => m.scores[condition]).sort((a, b) => b.scores[condition].balanced_accuracy - a.scores[condition].balanced_accuracy)[0];
    const instant = best("instant");
    const reasoned = best("reasoned");
    const sketch = D.references["Four-fact sketch"][D.level];
    const items = [
      [fixed(instant.scores.instant.balanced_accuracy), `Best model answering instantly in K and MPa (${instant.label})`],
      [fixed(sketch), "Four textbook facts joined by the Clausius-Clapeyron equation"],
      [fixed(reasoned.scores.reasoned.balanced_accuracy), `Best model with reasoning allowed in K and MPa (${reasoned.label})`],
      ["0.25", "Random guessing"],
    ];
    $("stats").innerHTML = items.map(([a, b]) => `<div class="stat"><b>${a}</b><span>${b}</span></div>`).join("");
  }

  function pointerCell(event) {
    const box = $("bigMap").getBoundingClientRect();
    const x = Math.min(Math.max((event.clientX - box.left) / box.width, 0), 0.9999);
    const y = Math.min(Math.max(1 - (event.clientY - box.top) / box.height, 0), 0.9999);
    state.cell = { x, y };
    renderReadout();
  }

  function init() {
    buildCurves();
    buildAxes();
    legend($("legend"));
    legend($("atlasLegend"));
    legend($("unitLegend"));
    const select = $("modelSelect");
    for (const provider of ["anthropic", "openai"]) {
      const group = document.createElement("optgroup");
      group.label = PROVIDER[provider];
      for (const model of inOrder(provider)) {
        if (!hasCondition(model.id, "instant") && !hasCondition(model.id, "reasoned")) continue;
        group.appendChild(new Option(named(model), model.id));
      }
      select.appendChild(group);
    }
    select.addEventListener("change", () => setModel(select.value));
    segments($("viewControl"), "view", [["answers", "Answers"], ["errors", "Mistakes only"]], state.view, (value) => {
      state.view = value;
      renderBig();
    });
    const start = D.models.find((m) => m.id === "claude-sonnet-5-5") || D.models.find((m) => hasCondition(m.id, "instant"));
    setModel(start.id);

    const big = $("bigMap");
    big.addEventListener("pointermove", pointerCell);
    big.addEventListener("pointerdown", pointerCell);
    big.addEventListener("keydown", (event) => {
      const entry = currentMap();
      const step = 1 / (D.side >> entry.level);
      const cell = state.cell || START_CELL;
      const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
      if (!moves[event.key]) return;
      event.preventDefault();
      state.cell = {
        x: Math.min(Math.max(cell.x + moves[event.key][0], 0), 0.9999),
        y: Math.min(Math.max(cell.y + moves[event.key][1], 0), 0.9999),
      };
      renderReadout();
    });

    segments($("atlasCondition"), "atlasCondition", Object.entries(CONDITIONS).map(([v, t]) => [v, t]), "instant", renderAtlas);
    renderAtlas("instant");

    const reasoningRows = ["anthropic", "openai"].flatMap(inOrder).map((m) => ({
      provider: m.provider,
      label: m.label,
      name: named(m),
      a: m.scores.instant?.balanced_accuracy ?? null,
      b: m.scores.reasoned?.balanced_accuracy ?? null,
    })).filter((r) => r.a !== null || r.b !== null);
    const sketch = D.references["Four-fact sketch"][D.level];
    dumbbells($("reasoningChart"), reasoningRows, {
      domain: [0.6, 1],
      ticks: [0.6, 0.7, 0.8, 0.9, 1],
      reference: { value: sketch },
      label: "Balanced accuracy of each model answering instantly and with reasoning allowed",
      tip: (r) => `<b>${r.name}</b><br>Instant ${fixed(r.a, 3)}<br>Reasoning allowed ${fixed(r.b, 3)}`,
    });
    $("reasoningKey").innerHTML = `<span><i class="dot hollow"></i>Answering instantly</span><span><i class="dot" style="background:var(--anthropic)"></i>Reasoning allowed, Anthropic</span><span><i class="dot" style="background:var(--openai)"></i>Reasoning allowed, OpenAI</span><span>Vertical line: four-fact sketch, ${sketch.toFixed(2)}</span>`;

    fanChart($("fanCharts"), "instant");
    fanChart($("fanCharts"), "reasoned");
    const dates = D.models.filter((m) => Object.keys(m.curves).length).map((m) => m.released).sort();
    $("fanKey").innerHTML = `<span>${dates[0].slice(0, 7)}<i class="ramp-key"></i>${dates[dates.length - 1].slice(0, 7)} release date</span><span>Heavy lines: IAPWS. Hover a line to pick out one model.</span>`;

    renderMissed();
    segments($("regionCondition"), "regionCondition", Object.entries(CONDITIONS).map(([v, t]) => [v, t]), "instant", renderRegions);
    renderRegions("instant");
    renderBoiling();
    $("missedKey").innerHTML = `<span>At most one model wrong<i class="ramp-key" style="background:linear-gradient(90deg,rgb(238,242,244),rgb(42,120,214),rgb(13,54,107))"></i>All or all but one wrong</span>`;

    timeChart($("timeCharts"), "instant");
    timeChart($("timeCharts"), "reasoned");
    $("timeKey").innerHTML = `<span><i class="dot" style="background:var(--anthropic)"></i>Anthropic</span><span><i class="dot" style="background:var(--openai)"></i>OpenAI</span><span>Lines join models of the same family.</span>`;

    const showUnits = (condition) => {
      state.unitsCondition = condition;
      renderUnitsModels();
      renderUnitsChart(condition);
    };
    segments($("unitsCondition"), "unitsCondition", Object.entries(CONDITIONS).map(([v, t]) => [v, t]), "instant", showUnits);
    $("unitsModel").addEventListener("change", (event) => {
      state.unitsModel = event.target.value;
      renderUnitRow();
    });
    showUnits("instant");
    $("unitsKey").innerHTML = `<span><i class="dot hollow"></i>Same point, different units</span><span><i class="dot" style="background:var(--anthropic)"></i><i class="dot" style="background:var(--openai)"></i>Same prompt, asked twice</span>`;

    renderThoughts();
    renderTable();
    renderStats();
  }
  init();
})();
</script>
</body>
</html>
