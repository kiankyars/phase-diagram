<!-- widget: eyebrow -->
<div class="eyebrow">28 language models · IAPWS reference equations · <span id="totalAnswers"></span> answers</div>
<!-- widget: stats -->
<div class="stats" id="stats"></div>
<!-- widget: atlas -->
<fieldset class="control">
  <legend>Condition</legend>
  <div class="segments" id="atlasCondition"></div>
</fieldset>
<div class="legend flush" id="atlasLegend"></div>
<div class="atlas" id="atlas"></div>
<!-- widget: explorer -->
<div class="explorer">
  <div class="plate">
    <div class="chart-frame">
      <div class="y-axis" id="yAxis" aria-hidden="true"></div>
      <div class="map" id="bigMap" tabindex="0" role="application" aria-label="Phase diagram. Use the arrow keys to move between cells.">
        <canvas id="bigCanvas"></canvas>
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
          <use href="#trueCurves" id="bigCurves"></use>
          <rect class="cursor-shadow" id="cursorShadow" hidden></rect>
          <rect class="cursor" id="cursor" hidden></rect>
        </svg>
      </div>
      <div class="x-axis" id="xAxis" aria-hidden="true"></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="panel">
    <div class="control">
      <label for="modelSelect">Model</label>
      <select id="modelSelect"></select>
    </div>
    <fieldset class="control">
      <legend>Condition</legend>
      <div class="segments" id="conditionControl"></div>
    </fieldset>
    <fieldset class="control">
      <legend>Units in the prompt</legend>
      <div class="segments" id="framingControl"></div>
    </fieldset>
    <fieldset class="control">
      <legend>Show</legend>
      <div class="segments" id="viewControl"></div>
    </fieldset>
    <div class="readout">
      <div class="prompt" id="prompt"></div>
      <div class="verdict">
        <div><small>Model said</small><b id="said">–</b></div>
        <div><small>IAPWS</small><b id="actual">–</b></div>
      </div>
      <table class="readings" id="readings"></table>
    </div>
  </div>
</div>
<!-- widget: reasoning-chart -->
<div class="chart" id="reasoningChart"></div>
<div class="chart-key" id="reasoningKey"></div>
<!-- widget: fan-charts -->
<div class="two" id="fanCharts"></div>
<div class="chart-key" id="fanKey"></div>
<!-- widget: time-charts -->
<div class="two" id="timeCharts"></div>
<div class="chart-key" id="timeKey"></div>
<!-- widget: missed-maps -->
<div class="missed" id="missedMaps"></div>
<div class="chart-key" id="missedKey"></div>
<!-- widget: region-table -->
<fieldset class="control">
  <legend>Condition</legend>
  <div class="segments" id="regionCondition"></div>
</fieldset>
<div class="table-wrap"><table class="scores regions" id="regionTable"></table></div>
<!-- widget: units-maps -->
<div class="unit-controls">
  <div class="control">
    <label for="unitsModel">Model</label>
    <select id="unitsModel"></select>
  </div>
  <fieldset class="control">
    <legend>Condition</legend>
    <div class="segments" id="unitsCondition"></div>
  </fieldset>
</div>
<div class="legend flush" id="unitLegend"></div>
<p class="grid-note" id="unitGrid"></p>
<div class="unit-row" id="unitRow"></div>
<div class="chart" id="unitsChart"></div>
<div class="chart-key" id="unitsKey"></div>
<!-- widget: boil-chart -->
<div class="chart" id="boilChart"></div>
<div class="chart-key" id="boilKey"></div>
<!-- widget: thoughts -->
<div class="thoughts" id="thoughts"></div>
<div class="chart-key" id="thoughtKey"></div>
<!-- widget: score-table -->
<details>
  <summary>Show the table</summary>
  <div class="table-wrap"><table class="scores" id="scoreTable"></table></div>
</details>
